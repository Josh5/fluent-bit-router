name: Publish

on:
  workflow_dispatch:
  push:
    branches: ['feature-**', 'fix-**', staging, master]
  schedule:
    # At 02:30 on Saturday
    - cron: '30 2 * * 6'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-fluent-bit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 #v3.10.0

      - name: Set Docker image name
        id: set-image
        run: |
          echo  "GITHUB_REF:${GITHUB_REF}"
          echo  "GITHUB_REPOSITORY:${GITHUB_REPOSITORY}"
          VERSION_TAG=${GITHUB_REF#refs/*/}
          SHA_SHORT="${GITHUB_SHA::7}"
          ORG=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          echo "sha_short=${SHA_SHORT:?}" >> $GITHUB_OUTPUT
          echo "docker_image=ghcr.io/${ORG:?}/fluent-bit-router" >> $GITHUB_OUTPUT
          if [[ ${VERSION_TAG%/merge} == 'master' ]]; then
            echo "docker_tag=latest" >> $GITHUB_OUTPUT
          elif [[ ${VERSION_TAG%/merge} == 'staging' ]]; then
            echo "docker_tag=staging" >> $GITHUB_OUTPUT
          else
            echo "docker_tag=${SHA_SHORT:?}" >> $GITHUB_OUTPUT
          fi

      - name: Log into registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 #v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Container metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 #v5.7.0
        with:
          images: ${{ steps.set-image.outputs.docker_image }}
          labels: |
            maintainer=Josh.5
            source.version=${{ steps.set-image.outputs.sha_short }}
            source.project=fluent-bit-router
            source.service=fluent-bit-router
            org.opencontainers.image.title=fluent-bit-router

      - name: Build and push Container image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 #v6.15.0
        with:
          platforms: linux/amd64,linux/arm64
          context: docker
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.set-image.outputs.docker_image }}:${{ steps.set-image.outputs.docker_tag }}
          labels: ${{ steps.meta.outputs.labels }}
          # A dedicated scope prevents another Buildx job from replacing this
          # cache. mode=max exports intermediate stages, including the compiled
          # lua-cjson artifacts for both target architectures.
          cache-from: type=gha,scope=fluent-bit-router-image
          cache-to: type=gha,scope=fluent-bit-router-image,mode=max,timeout=20m
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build-swarm-stack-templates:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs: [build-fluent-bit]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2

      - name: Publish Swarm Template
        uses: Josh5/action.publish-swarm-stack@4392d434d4cfc8df552c7e92cf063428343f96d2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          templates_path: docker-swarm-templates
          branch_name: release/latest
